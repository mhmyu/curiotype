# Automatic dependency updates. See MAINTAINING.md, "Routine" and "Troubleshooting".
#
# - Minor and patch updates are grouped into ONE pull request per run, so they are quick to review.
# - Major updates are never grouped: each one gets its own pull request, so you can read its
#   release notes and decide separately.
version: 2
updates:
  # JavaScript packages (pnpm is detected from pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
