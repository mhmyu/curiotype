name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token. Safe for pull requests from forks.
permissions:
  contents: read

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm version is read from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      # Type-checks Astro and Svelte files.
      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test:run

      # Also validates the sentence corpus (see CONTENT_GUIDE.md, "Automatic checks").
      - name: Build
        run: pnpm build

      # Reads the HTML and static files in dist/ (meta tags, robots rules, CSP hashes); no browser.
      - name: Build output tests
        run: pnpm test:dist

  # Runs the browser tests (phone viewport) against the production build, split over two
  # parallel runners. Each runner builds the site itself and runs half of the tests.
  e2e-shards:
    name: End-to-end tests (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let both halves finish so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # Starts `astro preview` itself (see playwright.config.ts).
      - name: Run e2e tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # One stable check for branch protection: it keeps the name "End-to-end tests" whatever the
  # number of shards, and it is red when any shard is red, cancelled or skipped.
  e2e:
    name: End-to-end tests
    needs: e2e-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the shards
        run: |
          if [ "${{ needs.e2e-shards.result }}" != "success" ]; then
            echo "The end-to-end shards finished with: ${{ needs.e2e-shards.result }}"
            exit 1
          fi
